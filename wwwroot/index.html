<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de documentos</title>
<style>
  :root { --fg:#1d1d1f; --muted:#6b6b70; --line:#dcdce0; --accent:#2f5bd3; --ok:#1f7a3d; --bad:#b3261e; --bg:#fafafa; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--fg); background:var(--bg); }
  main { max-width:760px; margin:36px auto; padding:0 20px; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  label { display:block; font-weight:600; margin:20px 0 6px; }
  small, .muted { color:var(--muted); font-weight:400; }
  input[type=password], textarea, select { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  textarea { min-height:220px; resize:vertical; }
  input[type=file] { font:inherit; }
  button { padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.sec { background:transparent; color:var(--accent); padding:4px 6px; font-weight:500; }
  button:disabled { opacity:.5; cursor:default; }
  .card { padding:18px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .fila { display:flex; gap:8px; align-items:center; }
  .fila input { flex:1; }
  details { margin-top:20px; }
  summary { cursor:pointer; font-weight:600; }
  #estado { margin-top:28px; display:none; }
  .chip { padding:2px 10px; border-radius:99px; font-size:13px; font-weight:600; background:#eef0f6; }
  .chip.Terminado { background:#e3f3e8; color:var(--ok); }
  .chip.Error { background:#fbe7e6; color:var(--bad); }
  pre { white-space:pre-wrap; background:#f4f4f6; padding:10px; border-radius:8px; font-size:13px; max-height:260px; overflow:auto; }
  ul { margin:8px 0; padding-left:20px; }
  .error { color:var(--bad); margin-top:8px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Generador de documentos</h1>
    <span id="conectado" hidden class="muted">Conectado · <button type="button" class="sec" id="salir">Salir</button></span>
  </header>
  <p class="sub">Escribe qué hay que hacer (o copia el enunciado que te han dado en papel), elige una plantilla si quieres y pulsa enviar. El agente te devuelve los documentos en un zip.</p>

  <!-- Acceso: solo la primera vez en este navegador -->
  <section id="login" class="card" hidden>
    <label for="clave" style="margin-top:0">Clave de acceso <small>(API_ACCESS_KEY de Render · solo la primera vez, se recuerda 90 días)</small></label>
    <div class="fila">
      <input type="password" id="clave" autocomplete="current-password">
      <button type="button" id="entrar">Entrar</button>
    </div>
    <div id="loginError" class="error" hidden></div>
  </section>

  <form id="f" hidden>
    <label for="plantilla">Plantilla <small>(qué tipo de material genera y en qué formato)</small></label>
    <select id="plantilla"><option value="">Ninguna: solo lo que escriba abajo</option></select>

    <label for="texto">Qué hay que hacer</label>
    <textarea id="texto" placeholder="Escribe aquí el enunciado o lo que necesitas. Por ejemplo:&#10;&#10;Unidad: UT02 · HTML y CSS. Genera 1 supuesto de 90 minutos sobre una web con tabla y formulario, y 15 preguntas tipo test.&#10;&#10;Si el enunciado está en papel, cópialo aquí o súbele una foto en «Documentación»."></textarea>

    <details>
      <summary>Documentación y fichero de instrucciones (opcional)</summary>
      <label for="archivos">Documentación <small>(PDF, apuntes, fotos JPG/PNG de un papel, o un .zip · no hace falta si el agente ya la tiene en memoria)</small></label>
      <input type="file" id="archivos" multiple>
      <label for="instrFichero">Fichero de instrucciones <small>(.md, se añade a la plantilla y al texto)</small></label>
      <input type="file" id="instrFichero" accept=".md,.txt">
    </details>

    <p><button id="enviar" type="submit">Enviar trabajo</button></p>
    <div id="formError" class="error" hidden></div>
  </form>

  <section id="estado" class="card">
    <div class="fila"><strong>Trabajo</strong> <code id="tid"></code> <span id="chip" class="chip"></span></div>
    <p id="detalle"></p>
    <div id="extra"></div>
    <button id="descargar" type="button" hidden>Descargar zip</button>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const leer = (k) => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
let sondeo = null, actual = null;

async function api(url, opts = {}) {
  const r = await fetch(url, { credentials: 'same-origin', ...opts });
  if (r.status === 401 && !url.startsWith('/acceso')) { mostrarLogin(); throw new Error('Tienes que volver a entrar con la clave.'); }
  return r;
}

async function iniciar() {
  try {
    const r = await api('/acceso');
    const j = await r.json();
    j.conectado ? await mostrarFormulario() : mostrarLogin();
  } catch { mostrarLogin(); }
}

function mostrarLogin() {
  $('login').hidden = false; $('f').hidden = true; $('conectado').hidden = true;
  $('clave').focus();
}

async function mostrarFormulario() {
  $('login').hidden = true; $('f').hidden = false; $('conectado').hidden = false;
  const r = await api('/plantillas');
  if (!r.ok) return;
  const sel = $('plantilla');
  sel.length = 1;
  for (const p of await r.json()) sel.add(new Option(p.titulo, p.id));
  sel.value = leer('plantilla');
  if (sel.selectedIndex < 0) sel.value = '';
  $('texto').value = leer('borrador');
}

$('entrar').addEventListener('click', entrar);
$('clave').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); entrar(); } });
async function entrar() {
  $('loginError').hidden = true;
  const r = await api('/acceso', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ clave: $('clave').value }) });
  if (r.ok) { $('clave').value = ''; await mostrarFormulario(); }
  else { $('loginError').textContent = 'La clave no es correcta.'; $('loginError').hidden = false; }
}

$('salir').addEventListener('click', async () => { await api('/acceso', { method: 'DELETE' }); mostrarLogin(); });
$('plantilla').addEventListener('change', () => guardar('plantilla', $('plantilla').value));
$('texto').addEventListener('input', () => guardar('borrador', $('texto').value));

$('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  $('formError').hidden = true;
  const datos = new FormData();
  if ($('plantilla').value) datos.append('plantilla', $('plantilla').value);
  if ($('texto').value.trim()) datos.append('instruccionesTexto', $('texto').value);
  if ($('instrFichero').files[0]) datos.append('instrucciones', $('instrFichero').files[0]);
  for (const f of $('archivos').files) datos.append('archivos', f);
  if (![...datos.keys()].some(k => k !== 'archivos')) {
    $('formError').textContent = 'Escribe qué hay que hacer o elige una plantilla.'; $('formError').hidden = false; return;
  }

  $('enviar').disabled = true;
  mostrar({ estado: 'Enviando', texto: 'Subiendo… (si el servicio estaba dormido puede tardar un minuto)' });
  try {
    const r = await api('/trabajos', { method: 'POST', body: datos });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || j.title || ('Error ' + r.status));
    actual = j.id;
    pintar(j);
    clearInterval(sondeo);
    sondeo = setInterval(consultar, 4000); // además mantiene despierto el servicio Free
  } catch (e) {
    mostrar({ estado: 'Error', texto: e.message });
    $('enviar').disabled = false;
  }
});

async function consultar() {
  try {
    const r = await api('/trabajos/' + actual);
    if (!r.ok) { clearInterval(sondeo); mostrar({ estado: 'Error', texto: 'No se encuentra el trabajo (¿se reinició el servicio?).' }); $('enviar').disabled = false; return; }
    const t = await r.json();
    pintar(t);
    if (t.estado === 'Terminado' || t.estado === 'Error') { clearInterval(sondeo); $('enviar').disabled = false; }
  } catch { /* se reintenta en el siguiente ciclo */ }
}

function pintar(t) {
  const seg = t.iniciado ? Math.round(((t.terminado ? new Date(t.terminado) : new Date()) - new Date(t.iniciado)) / 1000) : 0;
  const textos = {
    EnCola: 'En cola…',
    Procesando: `El agente está trabajando (${seg} s)… Puede tardar varios minutos: no cierres la pestaña.`,
    Terminado: `Terminado en ${seg} s` + (t.costeUsd != null ? ` · coste aprox. ${t.costeUsd.toFixed(2)} $` : '') + (t.mensaje ? ` · Aviso: ${t.mensaje}` : ''),
    Error: t.mensaje || 'Error',
  };
  mostrar({ estado: t.estado, texto: textos[t.estado] || t.estado, id: t.id });
  let extra = t.sesionId ? `<p><small>Sesión del agente: <code>${esc(t.sesionId)}</code> (búscala en platform.claude.com/sessions)</small></p>` : '';
  if (t.estado === 'Terminado') extra += '<strong>Ficheros generados</strong><ul>' + t.ficherosResultado.map(f => `<li>${esc(f)}</li>`).join('') + '</ul>';
  if (t.resumen) extra += '<strong>Resumen del agente</strong><pre>' + esc(t.resumen) + '</pre>';
  $('extra').innerHTML = extra;
  $('descargar').hidden = t.estado !== 'Terminado';
}

function mostrar({ estado, texto, id }) {
  $('estado').style.display = 'block';
  $('tid').textContent = id ? id.slice(0, 8) : '';
  $('chip').textContent = estado;
  $('chip').className = 'chip ' + estado;
  $('detalle').textContent = texto;
  if (!id) { $('extra').innerHTML = ''; $('descargar').hidden = true; }
}

$('descargar').addEventListener('click', async () => {
  const r = await api(`/trabajos/${actual}/resultado`);
  if (!r.ok) { $('detalle').textContent = 'No se pudo descargar: el resultado puede haber caducado.'; return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `resultado-${actual.slice(0, 8)}.zip`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

iniciar();
</script>
</body>
</html>
